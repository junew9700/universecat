function maybeShowDailyCheckPopup(){if(page!=='home'||profile.dailyCheckPopupDate===todayKey())return;profile.dailyCheckPopupDate=todayKey();const c=getDailyTicket();save();let root=document.getElementById('modal-root');if(!root){root=document.createElement('div');root.id='modal-root';app.appendChild(root)}root.innerHTML='<div class="modal-backdrop"><section class="modal check-modal"><button class="modal-x" data-action="close-daily-check" aria-label="關閉">×</button><div class="modal-icon">'+cuteIcon('star',36)+'</div><h2>今日宇宙支票已送達</h2><p class="subtle">每日首次開啟時送你一張今日宇宙支票。</p>'+ticketCard(c)+'<div class="button-row"><button class="secondary" data-action="close-daily-check">稍後查看</button><button class="primary" data-action="open-daily-check">查看支票</button></div></section></div>';randomizeCatArts()}

app.addEventListener('click',function(ev){const b=ev.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,v=b.dataset.value,idv=b.dataset.id;switch(a){

case 'g-review':if(document.getElementById('g-other'))flow.otherTarget=document.getElementById('g-other').value.trim();if(!flow.events.length){toast('請至少選一個事件類型');break}if(!flow.targets.length){toast('請至少選一位感謝對象');break}if(flow.targets.includes('其他')&&!flow.otherTarget){toast('請填寫其他感謝對象');break}flow.step=4;render();break;
case 'g-back':flow.step=3;render();break;
case 'g-save':{let session={id:flow.editingId||id(),date:flow.date||todayKey(),events:flow.events,targets:flow.targets,otherTarget:flow.otherTarget,savedAt:new Date().toISOString()};const ix=profile.gratitude.findIndex(function(x){return x.id===session.id});if(ix>=0)profile.gratitude[ix]=session;else profile.gratitude.push(session);const wasEditing=!!flow.editingId;flow=null;page=wasEditing?gratitudeReturnPage:'gratitude-complete';encouragement=null;save();render();break}
case 'g-cancel':flow=null;page=gratitudeReturnPage;render();break;

case 'gratitude-back':page='gratitude';render();break;
case 'g-edit':openGratitude(idv,b.dataset.index===undefined?undefined:Number(b.dataset.index));break;

case 'g-delete-event':{if(!confirm('確定刪除這項感恩記錄？'))break;let s=profile.gratitude.find(function(x){return x.id===idv});if(s){s.events.splice(Number(b.dataset.index),1);save();render()}break}

case 's-start':startSuccess();break;
case 's-edit':startSuccess(idv);break;
case 's-home-type':successHomeType=v;render();break;
case 's-home-next':{const date=document.getElementById('s-home-date').value;if(!date||date>todayKey()){toast('日期不能晚於今天');break}successReturnPage='success';flow={kind:'success',step:2,date:date,events:[],currentType:successHomeType,currentContent:'',editingId:null};page='success';render();break}

case 's-next':if(document.getElementById('s-date'))flow.date=document.getElementById('s-date').value;if(!flow.date||flow.date>todayKey()){toast('日期不能晚於今天');break}if(!flow.currentType){toast('先選擇一個事件類型');break}flow.step=2;render();break;
case 's-add-next':if(saveSuccessCurrent()){flow.step=1;render()}break;
case 's-review':if(flow.editingId){flow.events=[{id:flow.editingId,type:flow.currentType,content:(document.getElementById('s-content')||{}).value||flow.currentContent}];flow.events[0].content=flow.events[0].content.trim();if(!flow.events[0].content){toast('請寫下具體內容');break}}else if(saveSuccessCurrent()){}else break;if(!flow.events.length){toast('至少新增一件小成功');break}flow.step=3;render();break;
case 's-remove-draft':flow.events.splice(Number(b.dataset.index),1);render();break;
case 's-back':flow.step=2;render();break;
case 's-save':if(flow.editingId){const x=flow.events[0];let old=profile.successes.find(function(y){return y.id===flow.editingId});if(old){old.type=x.type;old.content=x.content;old.date=flow.date}}else flow.events.forEach(function(e){profile.successes.push({id:id(),date:flow.date,type:e.type,content:e.content,createdAt:new Date().toISOString()})});flow=null;page=successReturnPage;encouragement='success';save();render();break;
case 's-cancel':flow=null;page=successReturnPage;render();break;
case 'success-back':activeSuccessPrompt=chooseDifferent(successPrompts,activeSuccessPrompt);page='success';render();break;
case 's-delete':if(confirm('確定刪除這項成功記錄？')){profile.successes=profile.successes.filter(function(x){return x.id!==idv});save();render()}break;
case 'check-mode':activeCheckType=v;ticketEditMode=false;flow=null;render();break;
case 'daily-ticket-edit':case 'daily-purpose-edit':editDailyTicket();break;
case 'daily-payee-edit':ticketEditField='payee';ticketEditMode=true;render();break;
case 'daily-ticket-cancel':ticketEditMode=false;render();break;
case 'daily-ticket-save':{const purposeInput=document.getElementById('daily-purpose'),payeeInput=document.getElementById('daily-payee');const purpose=purposeInput?(purposeInput.value||'').trim():ticket.purpose;if(!purpose){toast('請填寫支票目的');break}ticket.purpose=purpose;if(payeeInput){ticket.payeeName=(payeeInput.value||'').trim();ticket.payeeNameEdited=true;}profile.dailyTicket=ticket;profile.lastDailyCheckPurpose=purpose;ticketEditMode=false;save();render();toast('今日支票已更新');break}
case 'custom-preview':{const amount=Number(document.getElementById('c-amount').value);if(!amount||amount<0){toast('請輸入有效金額');break}flow={kind:'custom-preview',check:{id:id(),kind:'custom',date:todayKey(),amount:amount,currency:document.getElementById('c-currency').value,purpose:document.getElementById('c-purpose').value.trim(),payeeName:document.getElementById('c-payee').value.trim()}};render();break}
case 'custom-edit':flow=null;render();break;
case 'custom-download':downloadCheck(flow.check);break;
case 'check-download':downloadCheck(ticket);break;
case 'check-share':shareCheck(ticket);break;
case 'notify-toggle':profile.settings.notify=!profile.settings.notify;save();render();break;
case 'affirm-add':{const text=(document.getElementById('affirm-new').value||'').trim();if(!text){toast('先寫下一句肯定語');break}profile.customAffirmations.push({id:id(),text:text});save();render();toast('已加入肯定語庫');break}
case 'affirm-delete':if(confirm('刪除這句自訂肯定語？')){profile.customAffirmations=profile.customAffirmations.filter(function(x){return x.id!==idv});save();render()}break;

case 'widget-info':alert('桌面 Widget 需要原生 WidgetKit／App Group；Expo Go 與網頁版不能安裝。正式原生版本再提供加入主畫面功能。');break;
case 'export':exportData();break;

case 'clear-data':if(confirm('確定刪除這個此瀏覽器的所有記錄？此操作不能還原。')){profile=emptyProfile();save();render();toast('已刪除本機資料')}break;
case 'tutorial-replay':page='onboarding';onboardingStep=0;render();break;
case 'encouragement-close':encouragement=null;render();break;
case 'modal-close':case 'modal-close-btn':case 'close-daily-check':{const r=document.getElementById('modal-root');if(r)r.innerHTML='';break}
case 'open-daily-check':{const r=document.getElementById('modal-root');if(r)r.innerHTML='';ticket=getDailyTicket();page='checks';render();break}
}});
app.addEventListener('change',function(e){if(e.target.dataset.action==='gratitude-year'){gratitudeFilterYear=e.target.value;render()}if(e.target.dataset.action==='gratitude-month'){gratitudeFilterMonth=e.target.value;render()}if(e.target.dataset.action==='success-year'){successFilterYear=e.target.value;render()}if(e.target.dataset.action==='success-month'){successFilterMonth=e.target.value;render()}if(e.target.id==='s-date'&&flow)flow.date=e.target.value;if(e.target.id==='import-file'){const file=e.target.files[0];if(file)importFile(file)}if(e.target.dataset.action==='notify-time'){profile.settings.notifyTime=e.target.value;save();toast('已保存提醒時間')}if(e.target.dataset.action==='language'){profile.settings.language=e.target.value;save();render();toast('語言偏好已更新')}});

function exportData(){const blob=new Blob([JSON.stringify({format:'universe-cat-demo',schemaVersion:3,exportedAt:new Date().toISOString(),profile:profile},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='宇宙小貓備份-'+todayKey()+'.json';a.click();URL.revokeObjectURL(a.href);toast('備份已匯出')}
function importFile(file){const r=new FileReader();r.onload=function(){try{const obj=JSON.parse(r.result);if(obj.format!=='universe-cat-demo'||!obj.profile)throw Error('invalid');if(!confirm('匯入會取代目前瀏覽器的本機資料，是否繼續？'))return;profile=obj.profile;profile.gratitude=profile.gratitude||[];profile.successes=profile.successes||[];profile.checks=profile.checks||[];profile.luckyDraws=profile.luckyDraws||[];profile.checkIns=profile.checkIns||[];profile.checkInBadges=profile.checkInBadges||[];profile.checklists=profile.checklists||{gratitude:[],ticket:[]};profile.checklists.gratitude=profile.checklists.gratitude||[];profile.checklists.ticket=profile.checklists.ticket||[];profile.customAffirmations=profile.customAffirmations||[];profile.settings=Object.assign(emptyProfile().settings,profile.settings||{});save();render();toast('備份已匯入')}catch(e){alert('備份檔格式不正確，沒有修改現有資料。')}};r.readAsText(file)}
function moveDeviceSettingsNotice(){if(page!=='settings')return;const main=app.querySelector('main.shell');if(!main)return;const row=Array.from(main.querySelectorAll('.settings-row')).find(function(item){return item.querySelector('.status.done')});if(row&&!row.closest('.settings-device-card')){const section=document.createElement('section');section.className='card settings-device-card';section.appendChild(row);main.appendChild(section)}if(!main.querySelector('.feedback-card')){const section=document.createElement('section');section.className='card feedback-card';const button=document.createElement('a');button.className='secondary full feedback-link';button.href='mailto:?subject='+encodeURIComponent('宇宙小貓意見回饋')+'&body='+encodeURIComponent('你好，我想提供以下意見：\n\n');button.textContent='提供意見';section.appendChild(button);main.appendChild(section)}}const deviceNoticeObserver=new MutationObserver(moveDeviceSettingsNotice);deviceNoticeObserver.observe(app,{childList:true});window.setInterval(function(){const nextQuote=quoteForCurrentHour();if(nextQuote.original!==currentManifestQuote.original){currentManifestQuote=nextQuote;if(page==='home')render()}},15000);try{createCosmicBackdrop();if(!meta.onboardingDone){page='onboarding'}render()}catch(error){console.error('宇宙小貓啟動錯誤',error);app.innerHTML='<main class="shell"><section class="card" role="alert"><h1>頁面載入遇到問題</h1><p>喵～請重新載入頁面。</p><button class="primary" type="button" onclick="location.reload()">重新載入</button></section></main>'}
