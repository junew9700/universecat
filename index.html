function getDailyTicket(){if(profile.dailyTicket&&profile.dailyTicket.date===todayKey()){if(!profile.dailyTicket.payeeNameEdited&&currentDisplayName()&&profile.dailyTicket.payeeName!==currentDisplayName()){profile.dailyTicket.payeeName=currentDisplayName();save()}return profile.dailyTicket;}const pool=[1000,5000,8888,10000,18888,50000,88888];const legacy=profile.checks.filter(function(c){return c.kind==='daily'}).sort(function(a,b){return b.date.localeCompare(a.date)})[0];const prevAmount=profile.lastDailyCheckAmount||(legacy&&legacy.amount);const options=pool.filter(function(n){return !prevAmount||n!==prevAmount});const amount=options[Math.floor(Math.random()*options.length)];const purposes=['完成重要目標，步步靠近夢想','擁有更多自在的創作時間','開啟新的學習與成長旅程','為理想生活添一份安心','讓喜歡的計畫順利啟程','把心中的創作慢慢實現','迎接充滿靈感的一段日子','為重要的夢想預留空間','探索新的機會與可能','讓日常多一點從容與選擇','支持一個珍惜已久的計畫','為未來生活累積更多自由','完成一直想做的一件事','讓努力開花結果','為自己創造美好新體驗'];const prevPurpose=profile.lastDailyCheckPurpose||profile.dailyTicket&&profile.dailyTicket.purpose||(legacy&&legacy.purpose);const purposeOptions=purposes.filter(function(x){return x!==prevPurpose});const purpose=purposeOptions[Math.floor(Math.random()*purposeOptions.length)];const found={id:id(),kind:'daily',date:todayKey(),amount:amount,currency:profile.settings.currency||'HKD',purpose:purpose,payeeName:currentDisplayName()||'每天都很開心的我',payeeNameEdited:false,createdAt:new Date().toISOString()};profile.dailyTicket=found;profile.lastDailyCheckAmount=amount;profile.lastDailyCheckPurpose=purpose;save();return found}

function aboutPage(){return '<main class="shell info-page-shell">'+head('關於宇宙小貓')+'<section class="card info-page about-page"><div class="info-cat cat-art art-cloud" aria-hidden="true"></div><section class="about-cat-intro"><h2 class="about-cat-title">大家好，我是宇宙小貓！<span class="about-cat-inline cat-art art-cloud" aria-hidden="true"></span></h2><p>我住在宇宙裡，有時也會跑到地球上玩，看看大家的生活，收集閃亮的小願望。<br><br>我最喜歡吃美味的小魚乾，也最喜歡陪伴大家寫下心願、發現生活中的小確幸，努力為每一個願望加油打氣，喵～</p></section><hr class="about-divider"><section class="about-developer"><h2>關於開發者</h2><p>我是一位熟悉網站內容管理的行銷人員。因為對顯化和感恩日記有興趣，也希望讓更多人認識顯化、關注和改善心理健康，加上本身喜歡貓咪，於是把這些想法結合起來，製作了宇宙小貓這個網站。</p><p>我相信每天停下來片刻，記下值得感謝的人和事，可以幫助我們整理心願，留意生活中的美好與可能。不過，開始容易，持之以恆卻不容易；所以希望透過小貓的陪伴，讓顯化練習和感恩日記變得可愛、輕鬆，也更容易融入日常。</p><p>這個網站由我使用 AI 輔助的 vibe coding 方式製作，將自己的興趣和想法一步步變成可以使用的小天地。希望宇宙小貓能陪伴你寫下心願、珍惜生活中的小確幸，再一步一步朝理想的生活前進。</p></section><p class="about-contact">如果在使用过程中有任何問題，歡迎聯繫 <a href="mailto:enquiry@manifestuniversecat.com">enquiry@manifestuniversecat.com</a>，<span>或者</span> <a href="#contact" data-action="footer-page" data-page="contact">填写查詢表格</a> 哦！<br><br>谢谢您的使用 :)</p></section></main>'}
function privacyPage(){return '<main class="shell info-page-shell">'+head('隱私政策')+'<section class="card info-page privacy-page"><p class="privacy-updated">最後更新：2026 年 11 月 22 日</p><p>宇宙小貓重視你的個人資料私隱。本政策說明網站會收集及使用哪些資料、資料如何保存，以及你可以如何查閱或更正資料。本政策按香港《個人資料（私隱）條例》（第 486 章）的常見私隱政策格式編寫。</p><h2>我們收集的資料</h2><ul><li>註冊資料：顯示名稱、電郵地址及登入憑證。</li><li>你自行建立的感恩日記、成功日記、願望支票及網站偏好。</li><li>你透過聯絡表格提供的姓名、電郵地址和查詢內容。</li><li>網站使用的本機儲存資料，用來記住登入狀態、語言和使用者資料。</li></ul><h2>收集資料的用途</h2><p>資料用於建立及識別本機帳號、顯示和保存你在本機裝置輸入的內容、回覆你的查詢，以及維持網站基本功能。除非得到你的同意或法律要求，資料不會用於無關目的。</p><h2>保存方式及保安</h2><p>目前版本是靜態示範網站。帳號和日記資料保存在你使用的瀏覽器本機儲存空間，不會自動上載或同步到雲端；清除瀏覽器資料、轉換瀏覽器或裝置可能令資料無法取回。請妥善保管裝置及登入資料。互聯網傳輸及電子裝置不能保證絕對安全。</p><h2>電郵查詢及第三方披露</h2><p>聯絡表格會在你的電郵程式建立草稿；只有你自行按下傳送後，查詢才會寄往 enquiry@manifestuniversecat.com。收到的查詢只會用於處理及回覆，並在不再需要時刪除。除法律要求、保障權利或取得你同意外，我們不會出售或出租個人資料。</p><h2>查閱、更正及聯絡</h2><p>你可透過 enquiry@manifestuniversecat.com 聯絡開發者，提出查閱或更正個人資料的要求，或查詢本政策。日記亦可透過網站提供的匯出及刪除功能由你自行管理。</p><p>使用本網站即表示你已閱讀本政策。若政策有重大更新，網站會更新本頁內容及最後更新日期。</p></section></main>'}
